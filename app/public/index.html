<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenetic Learning Hub</title>
<meta name="description" content="AI-powered learning and training for the Zenetic Pharma field force. Demonstration environment.">
<link rel="icon" href="/assets/zenetic-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/css/brand.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="zn-page">
  <div class="lh-banner" data-i18n="banner"></div>

  <header class="zn-header lh-header">
    <a class="lh-brand" href="/" aria-label="Zenetic Learning Hub, home">
      <img class="zn-header__logo" src="/assets/zenetic-logo.svg" alt="Zenetic Pharma" width="196" height="36">
      <span class="lh-brand__product" data-i18n="appName"></span>
    </a>
    <div class="lh-controls">
      <div class="lh-lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="es" aria-pressed="false">ES</button>
      </div>
      <span class="zn-header__user" data-user-chip hidden>
        <span class="lh-avatar" data-user-initials></span>
        <span data-user-name></span>
      </span>
      <button type="button" class="lh-link" data-switch-user hidden data-i18n="switchUser"></button>
    </div>
  </header>

  <main class="lh-main" id="view" tabindex="-1"></main>

  <footer class="zn-footer">
    <span>Zenetic Pharma</span>
    <span class="zn-footer__sep">&middot;</span>
    <span data-i18n="footer"></span>
    <span class="zn-footer__sep">&middot;</span>
    <button type="button" class="lh-link" data-reset data-i18n="resetDemo"></button>
  </footer>
</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
