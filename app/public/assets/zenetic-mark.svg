<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Zenetic Pharma">
  <title>Zenetic Pharma</title>
  <!-- Mark only: square, so it survives being cropped to a favicon or an
       app tile. The lockup with the wordmark is zenetic-logo.svg. -->
  <rect width="32" height="32" rx="9" fill="#2D2A5E"/>
  <!-- The Z is drawn as a stroke rather than a filled path so its weight
       scales with the tile instead of being baked in at one size. -->
  <path d="M10 10.5 H22 L10 21.5 H22"
        fill="none" stroke="#FFFFFF" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
